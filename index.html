<script>

const templates = {

project: `library ieee;
use ieee.std_logic_1164.all;
use ieee.numeric_std.all;

entity my_entity is
    port (
        clk : in  std_logic;
        rst : in  std_logic;
        d   : in  std_logic_vector(7 downto 0);
        q   : out std_logic_vector(7 downto 0)
    );
end entity my_entity;

architecture rtl of my_entity is

begin

    -- example body: registered capture, replace with your design logic
    -- (ports and behaviour match the Testbench Skeleton template)
    process(clk)
    begin
        if rising_edge(clk) then
            if rst = '1' then
                q <= (others => '0');
            else
                q <= d;
            end if;
        end if;
    end process;

end architecture rtl;`,

combinational: [

    /* ── Multiplexing ───────────────────────── */

    {
        title: "2:1 Multiplexer",
        group: "Multiplexing",
        desc: "Selects between two inputs with a single-bit select, using a concurrent conditional assignment.",
        diagram: { clk: "none", bit: true, inputs: ["a", "b", "sel"], out: "y", caption: "2:1 multiplexer" },
        code: `-- 2:1 multiplexer (sel = '1' -> a, sel = '0' -> b)
y <= a when sel = '1' else b;`
    },
    {
        title: "4:1 Multiplexer",
        group: "Multiplexing",
        desc: "Selects one of four inputs with a 2-bit select using a selected signal assignment; others covers the remaining meta-values.",
        diagram: { clk: "none", bit: true, inputs: ["d0", "d1", "d2", "d3", "sel"], out: "y", caption: "4:1 multiplexer" },
        code: `-- 4:1 multiplexer with a 2-bit select
with sel select
    y <= d0 when "00",
         d1 when "01",
         d2 when "10",
         d3 when others;   -- "11"`
    },
    {
        title: "N:1 Multiplexer",
        group: "Multiplexing",
        desc: "Generic mux that indexes an array of inputs with a numeric select. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", inputs: ["D", "sel"], out: "Y", caption: "N:1 multiplexer" },
        code: `-- N:1 multiplexer indexing an array of inputs
-- type slv_array is array (natural range <>) of std_logic_vector(W-1 downto 0);
-- signal d : slv_array(0 to N-1);   sel : std_logic_vector;
y <= d(to_integer(unsigned(sel)));`
    },
    {
        title: "1:4 Demultiplexer",
        group: "Multiplexing",
        desc: "Routes one input to the output chosen by a 2-bit select; every other output is driven low.",
        diagram: { clk: "none", bit: true, inputs: ["din", "sel"], outputs: ["y0", "y1", "y2", "y3"], caption: "1:4 demultiplexer" },
        code: `-- 1:4 demultiplexer: din -> one output, the rest driven to '0'
process(sel, din)
begin
    y0 <= '0'; y1 <= '0'; y2 <= '0'; y3 <= '0';   -- default all off
    case sel is
        when "00"   => y0 <= din;
        when "01"   => y1 <= din;
        when "10"   => y2 <= din;
        when others => y3 <= din;
    end case;
end process;`
    },
    {
        title: "Tri-State Buffer",
        group: "Multiplexing",
        desc: "Drives a bidirectional pad when output-enable is high and releases it to high-impedance otherwise. Use only at I/O pads, not for internal FPGA logic.",
        diagram: { clk: "none", inputs: ["data_out", "oe"], out: "pad", buses: ["data_out"], caption: "Tri-state buffer" },
        code: `-- Tri-state buffer for a bidirectional pad (oe = output enable)
pad     <= data_out when oe = '1' else (others => 'Z');
data_in <= pad;   -- always sample the pad`
    },

    /* ── Decoding & Encoding ────────────── */

    {
        title: "3:8 Decoder",
        group: "Decoding & Encoding",
        desc: "Drives a one-hot output selected by a 3-bit binary code. Requires ieee.numeric_std.all.",
        diagram: { trapezoid: "decoder", inputs: ["sel"], out: "y", buses: ["sel", "y"], caption: "3:8 decoder" },
        code: `-- 3-to-8 one-hot decoder
process(sel)
begin
    y <= (others => '0');
    y(to_integer(unsigned(sel))) <= '1';   -- last assignment wins
end process;`
    },
    {
        title: "3:8 Decoder with Enable",
        group: "Decoding & Encoding",
        desc: "One-hot decoder gated by an enable: every output is driven low while en = '0'. Requires ieee.numeric_std.all.",
        diagram: { trapezoid: "decoder", inputs: ["sel", "en"], out: "y", buses: ["sel", "y"], caption: "3:8 decoder + enable" },
        code: `-- 3-to-8 one-hot decoder with enable (all outputs '0' when disabled)
process(sel, en)
begin
    y <= (others => '0');
    if en = '1' then
        y(to_integer(unsigned(sel))) <= '1';
    end if;
end process;`
    },
    {
        title: "Priority Encoder",
        group: "Decoding & Encoding",
        desc: "Outputs the index of the highest-priority set bit; valid is low when no bit is set.",
        diagram: { trapezoid: "encoder", inputs: ["d"], outputs: ["y", "valid"], buses: ["d", "y"], caption: "8:3 priority encoder" },
        code: `-- 8-to-3 priority encoder (bit 7 = highest priority)
process(d)
begin
    y     <= (others => '0');
    valid <= '1';
    if    d(7) = '1' then y <= "111";
    elsif d(6) = '1' then y <= "110";
    elsif d(5) = '1' then y <= "101";
    elsif d(4) = '1' then y <= "100";
    elsif d(3) = '1' then y <= "011";
    elsif d(2) = '1' then y <= "010";
    elsif d(1) = '1' then y <= "001";
    elsif d(0) = '1' then y <= "000";
    else                  valid <= '0';
    end if;
end process;`
    },
    {
        title: "One-Hot to Binary",
        group: "Decoding & Encoding",
        desc: "Returns the index of the single set bit of a one-hot input. Requires ieee.numeric_std.all.",
        diagram: { trapezoid: "encoder", inputs: ["onehot"], out: "bin", buses: ["onehot", "bin"], caption: "One-hot to binary" },
        code: `-- One-hot to binary encoder (assumes exactly one bit set)
process(onehot)
    variable idx : natural;
begin
    idx := 0;
    for i in onehot'range loop
        if onehot(i) = '1' then
            idx := i;
        end if;
    end loop;
    bin <= std_logic_vector(to_unsigned(idx, bin'length));
end process;`
    },

    /* ── Comparators ────────────────────── */

    {
        title: "Equality Comparator",
        group: "Comparators",
        desc: "Asserts when two words are bit-for-bit equal, using the predefined vector equality.",
        diagram: { clk: "none", bit: true, inputs: ["a", "b"], out: "eq", buses: ["a", "b"], caption: "Equality comparator" },
        code: `-- Equality comparator
eq <= '1' when a = b else '0';`
    },
    {
        title: "Magnitude Comparator",
        group: "Comparators",
        desc: "Produces less-than, equal and greater-than flags for unsigned operands; cast to signed for signed compares. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", bit: true, inputs: ["a", "b"], outputs: ["lt", "eq", "gt"], buses: ["a", "b"], caption: "Magnitude comparator" },
        code: `-- Magnitude comparator (unsigned; use signed() for signed operands)
lt <= '1' when unsigned(a) < unsigned(b) else '0';
eq <= '1' when a = b                     else '0';
gt <= '1' when unsigned(a) > unsigned(b) else '0';`
    },

    /* ── Code Converters ────────────────── */

    {
        title: "Parity Generator / Checker",
        group: "Code Converters",
        desc: "Even-parity bit is the XOR of all data bits; the checker XORs it against the received parity to flag corruption. Uses the VHDL-2008 reduction operator.",
        diagram: { clk: "none", bit: true, inputs: ["data"], out: "parity", buses: ["data"], caption: "Parity generator" },
        code: `-- Even parity generator: XOR all bits together in a portable loop.
process(data)
    variable p : std_logic := '0';
begin
    p := '0';
    for i in data'range loop
        p := p xor data(i);
    end loop;
    parity <= p;
end process;

-- Parity checker: err = '1' when the received word was corrupted
process(data, rx_parity)
    variable p : std_logic := '0';
begin
    p := '0';
    for i in data'range loop
        p := p xor data(i);
    end loop;
    err <= '1' when p /= rx_parity else '0';
end process;`
    },
    {
        title: "Binary to Gray",
        group: "Code Converters",
        desc: "Converts binary to Gray code (g = b xor b shifted right by 1) so only one bit changes between consecutive values.",
        diagram: { clk: "none", bit: true, inputs: ["bin"], out: "gray", buses: ["bin", "gray"], caption: "Binary to Gray" },
        code: `-- Binary -> Gray:  g = b xor (b >> 1)
gray <= bin xor ('0' & bin(bin'high downto 1));`
    },
    {
        title: "Gray to Binary",
        group: "Code Converters",
        desc: "Reverses a Gray code back to binary with a prefix-XOR chain (b(i) = b(i+1) xor g(i)).",
        diagram: { clk: "none", bit: true, inputs: ["gray"], out: "bin", buses: ["gray", "bin"], caption: "Gray to binary" },
        code: `-- Gray -> binary: MSB copies through, each lower bit XORs the bit above
process(gray)
    variable b : std_logic_vector(gray'range);
begin
    b(gray'high) := gray(gray'high);
    for i in gray'high - 1 downto gray'low loop
        b(i) := b(i + 1) xor gray(i);
    end loop;
    bin <= b;
end process;`
    },
    {
        title: "Seven-Segment Decoder",
        group: "Code Converters",
        desc: "Maps a hex digit (0-F) to a 7-segment pattern in segment order abcdefg; shown active-high (1 = lit) — invert for a common-anode display.",
        diagram: { clk: "none", bit: true, inputs: ["digit"], out: "seg", buses: ["digit", "seg"], caption: "Seven-segment decoder" },
        code: `-- Hex digit -> 7-segment, seg = a b c d e f g  (seg(6)=a ... seg(0)=g)
-- active-HIGH (1 = lit); invert seg for a common-anode display
with digit select
    seg <= "1111110" when x"0",
           "0110000" when x"1",
           "1101101" when x"2",
           "1111001" when x"3",
           "0110011" when x"4",
           "1011011" when x"5",
           "1011111" when x"6",
           "1110000" when x"7",
           "1111111" when x"8",
           "1111011" when x"9",
           "1110111" when x"A",
           "0011111" when x"B",
           "1001110" when x"C",
           "0111101" when x"D",
           "1001111" when x"E",
           "1000111" when others;   -- F`
    },

    /* ── Shifters ────────────────── */

    {
        title: "Barrel Shifter",
        group: "Shifters",
        desc: "Rotates (or shifts) a word by an arbitrary amount in a single combinational path — no flip-flops. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", bit: true, inputs: ["d", "amt"], out: "q", buses: ["d", "q"], caption: "Barrel shifter" },
        code: `-- Combinational barrel shifter: rotate right by amt
-- (use rotate_left / srl / sll for the other directions)
q <= std_logic_vector(
        rotate_right(unsigned(d),
                     to_integer(unsigned(amt))));`
    },
    {
        title: "Arithmetic Shift Right",
        group: "Shifters",
        desc: "Shifts a signed word right by an arbitrary amount while replicating the sign bit (÷2^amt for two's-complement). shift_right on unsigned gives a logical, zero-filled shift instead. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", bit: true, inputs: ["d", "amt"], out: "q", buses: ["d", "q"], caption: "Arithmetic shift right" },
        code: `-- Combinational arithmetic shift right by amt (sign-preserving)
-- shift_right on SIGNED replicates the MSB (sign bit);
-- use shift_right on UNSIGNED for a logical (zero-fill) shift.
q <= std_logic_vector(
        shift_right(signed(d),
                    to_integer(unsigned(amt))));`
    }

],

arithmetic: [

    /* ── Add / Subtract ───────────────────── */

    {
        title: "Adder with Carry",
        group: "Add / Subtract",
        desc: "Unsigned adder that also produces a carry-out by computing one bit wider; carry-in chains multiple adders. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", bit: true, inputs: ["a", "b", "cin"], outputs: ["sum", "cout"], buses: ["a", "b", "sum"], caption: "Adder with carry" },
        code: `-- Unsigned adder with carry-in and carry-out (requires ieee.numeric_std.all)
-- compute one bit wider; the extra MSB of the sum is the carry-out
signal wide : unsigned(a'length downto 0);

wide <= ('0' & unsigned(a)) + ('0' & unsigned(b))
        + resize(unsigned'(0 => cin), a'length + 1);
sum  <= std_logic_vector(wide(a'length - 1 downto 0));
cout <= wide(a'length);`
    },
    {
        title: "Subtractor with Borrow",
        group: "Add / Subtract",
        desc: "Unsigned subtractor whose borrow-out flags an underflow (a < b), again by working one bit wider. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", bit: true, inputs: ["a", "b"], outputs: ["diff", "borrow"], buses: ["a", "b", "diff"], caption: "Subtractor with borrow" },
        code: `-- Unsigned subtractor with borrow-out (requires ieee.numeric_std.all)
-- borrow = '1' when a < b (the result underflowed)
signal wide : unsigned(a'length downto 0);

wide   <= ('0' & unsigned(a)) - ('0' & unsigned(b));
diff   <= std_logic_vector(wide(a'length - 1 downto 0));
borrow <= wide(a'length);`
    },
    {
        title: "Adder / Subtractor",
        group: "Add / Subtract",
        desc: "Mode-selectable add or subtract (op = '0' adds, '1' subtracts); wraps on overflow. Requires ieee.numeric_std.all.",

signal quot : unsigned(N-1 downto 0);       -- dividend, becomes the quotient
signal dvsr : unsigned(N-1 downto 0);
signal cnt  : natural range 0 to N;
signal busy : std_logic := '0';

    variable diff : unsigned(N downto 0);   -- extra bit captures the borrow
begin
    if rising_edge(clk) then
        done <= '0';
        if busy = '0' then
            if start = '1' then
                remr <= (others => '0');
                quot <= unsigned(a);
                dvsr <= unsigned(b);
                cnt  <= N;
                busy <= '1';
            end if;
        else
            diff := (remr & quot(N-1)) - ('0' & dvsr);   -- shift in next bit, trial subtract

                remr <= remr(N-2 downto 0) & quot(N-1);
                quot <= quot(N-2 downto 0) & '0';
            end if;
            cnt <= cnt - 1;
            if cnt = 1 then
                busy <= '0';
                done <= '1';
            end if;
        end if;
    end if;
end process;

q <= std_logic_vector(quot);                -- quotient
r <= std_logic_vector(remr);                -- remainder`

fb <= qr(0) xor qr(2) xor qr(3) xor qr(5);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (0 => '1', others => '0');   -- non-zero seed (all-zero locks up)
        else
            qr <= fb & qr(15 downto 1);      -- feedback into MSB
        end if;
    end if;
end process;`

        title: "LFSR — Galois (Internal XOR)",
        group: "Feedback",
        desc: "Same maximal-length polynomial in Galois (one-to-many) form: fewer XOR paths, faster in hardware. Requires VHDL-2008 for the array xor.",
        diagram: { inputs: [], reset: "sync", caption: "16-bit LFSR (Galois)" },
        code: `-- 16-bit maximal-length LFSR (Galois / one-to-many)
-- same polynomial x^16 + x^14 + x^13 + x^11 + 1
-- tap mask = x"B400"  (bits 15, 13, 12, 10)
-- initialize to a non-zero seed to avoid locking in the all-zero state.
signal qr : std_logic_vector(15 downto 0) := (0 => '1', others => '0');

process(clk)
    variable nx : std_logic_vector(15 downto 0);
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (0 => '1', others => '0');
        else
            nx := '0' & qr(15 downto 1);     -- shift right
            if qr(0) = '1' then

            qr <= nx;
        end if;

        code: `-- Programmable delay line:
-- dout lags din by SEL+1 clock cycles (input is registered first)
-- guard the tap so sel stays within the valid range of the shift register.
signal qr : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (others => '0');
        else
            qr <= qr(N-2 downto 0) & din;
        end if;
    end if;
end process;

-- valid only when sel < N; otherwise hold the output at 0
-- sel must be sized to cover 0 .. N-1.
process(sel)
begin
    if unsigned(sel) < N then
        dout <= qr(to_integer(unsigned(sel)));
    else
        dout <= (others => '0');
    end if;

-- Outputs depend on the CURRENT STATE only.
type state_t is (IDLE, S1, S2);       -- define your own states
signal state, nstate : state_t;

-- 1) state register (sequential)
process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            state <= IDLE;            -- reset to a known state
        else
            state <= nstate;
        end if;
    end if;

    nstate <= state;                  -- default: hold (prevents latches)
    y      <= '0';                    -- default outputs (drive per state)
    case state is
        when IDLE => if x = '1' then nstate <= S1; end if;
        when S1   => if x = '1' then nstate <= S2; end if;

constant S1   : state_t := "01";
constant S2   : state_t := "10";      -- "11" is unused / illegal

        diagram: { inputs: ["DIN", "WR", "RD"], out: "DOUT", reset: "sync", caption: "Synchronous FIFO (full / empty)" },
        code: `-- Single-clock FIFO with full/empty flags (DEPTH = 2**ADDR_W words)
type mem_t is array (0 to DEPTH-1) of std_logic_vector(WIDTH-1 downto 0);
signal mem        : mem_t;
signal wptr, rptr : unsigned(ADDR_W-1 downto 0) := (others => '0');
signal count      : unsigned(ADDR_W downto 0)   := (others => '0');  -- 0..DEPTH

full  <= '1' when count = DEPTH else '0';
empty <= '1' when count = 0     else '0';

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            wptr  <= (others => '0');
            rptr  <= (others => '0');
            count <= (others => '0');
        else
            if wr = '1' and count /= DEPTH then          -- write when not full

                wptr <= wptr + 1;

                rptr <= rptr + 1;

            elsif (rd = '1' and count /= 0) and not (wr = '1' and count /= DEPTH) then

    end if;
end process;`

    {
        title: "Asynchronous FIFO — Dual-Clock",
        group: "FIFO",
        desc: "Dual-clock FIFO for crossing clock domains: Gray-code read/write pointers are passed through 2-FF synchronizers so full and empty stay safe across the wr_clk and rd_clk domains. DEPTH = 2**ADDR_W. Requires ieee.numeric_std.all.",
        diagram: { clk: "none", inputs: ["wr_clk", "din", "wr", "rd_clk", "rd"], out: "dout", buses: ["din", "dout"], caption: "Async FIFO (two clocks)" },
        code: `-- Asynchronous (dual-clock) FIFO: Gray-code pointers + 2-FF synchronizers.
-- Independent wr_clk / rd_clk domains; DEPTH = 2**ADDR_W words.
-- No reset: the pointers rely on the initial values below (fine on FPGAs);
-- use a synchronized reset in both domains where power-up state is not guaranteed.
type mem_t is array (0 to DEPTH-1) of std_logic_vector(WIDTH-1 downto 0);
signal mem : mem_t;

-- pointers use ADDR_W+1 bits; the extra MSB separates full from empty
signal wbin, wgry : unsigned(ADDR_W downto 0) := (others => '0');
signal rbin, rgry : unsigned(ADDR_W downto 0) := (others => '0');
signal rgry_w1, rgry_w2 : unsigned(ADDR_W downto 0) := (others => '0');  -- read Gray -> wr domain
signal wgry_r1, wgry_r2 : unsigned(ADDR_W downto 0) := (others => '0');  -- write Gray -> rd domain

-- write clock domain
process(wr_clk)
    variable nxt : unsigned(ADDR_W downto 0);
begin
    if rising_edge(wr_clk) then
        rgry_w1 <= rgry;  rgry_w2 <= rgry_w1;          -- 2-FF sync read pointer in
        if wr = '1' and full = '0' then
            mem(to_integer(wbin(ADDR_W-1 downto 0))) <= din;
            nxt  := wbin + 1;
            wbin <= nxt;
            wgry <= nxt xor ('0' & nxt(ADDR_W downto 1));   -- binary -> Gray
        end if;
    end if;
end process;

-- read clock domain
process(rd_clk)
    variable nxt : unsigned(ADDR_W downto 0);
begin
    if rising_edge(rd_clk) then
        wgry_r1 <= wgry;  wgry_r2 <= wgry_r1;          -- 2-FF sync write pointer in
        if rd = '1' and empty = '0' then
            dout <= mem(to_integer(rbin(ADDR_W-1 downto 0)));
            nxt  := rbin + 1;
            rbin <= nxt;
            rgry <= nxt xor ('0' & nxt(ADDR_W downto 1));
        end if;
    end if;
end process;

-- flags: empty compared in the read domain, full in the write domain
empty <= '1' when rgry = wgry_r2 else '0';
full  <= '1' when wgry = ((not rgry_w2(ADDR_W downto ADDR_W-1))
                          & rgry_w2(ADDR_W-2 downto 0)) else '0';`
    }

// Flattened list of every variant, used by the search filter.
function collectItems(groups)
{
    return groups.reduce((acc, g) =>
        acc.concat(g.children ? collectItems(g.children) : g.array), []);
}

const allTemplateItems = collectItems(templateGroups);

function buildSidebar()
{
    const container = document.getElementById("templates");
    container.innerHTML = "";

    const projectItem = document.createElement("div");
    projectItem.className = "template-item";
    projectItem.textContent = "VHDL Project Template";
    projectItem.onclick = () => loadProject(projectItem);
    container.appendChild(projectItem);

    templateGroups.forEach(tg => buildCategory(container, tg, false));

    return projectItem;
}

function buildCategory(container, tg, nested)
{
    const header = document.createElement("div");
    header.className =
        "template-group-header collapsed" + (nested ? " nested" : "");
    header.innerHTML =
        `<span>${tg.name}</span><span class="caret">▾</span>`;
    container.appendChild(header);

    const sub = document.createElement("div");
    sub.className = "template-subitems collapsed";
    container.appendChild(sub);

    header.onclick = () =>
    {
        header.classList.toggle("collapsed");
        sub.classList.toggle("collapsed");
    };

    if (tg.children)
        tg.children.forEach(child => buildCategory(sub, child, true));
    else
        buildGroupSubitems(sub, tg.array);
}

function buildGroupSubitems(container, array)
{
    const groups = [];
    array.forEach(item =>
    {
        if (!groups.includes(item.group))
            groups.push(item.group);
    });

    groups.forEach(group =>
    {
        const item = document.createElement("div");
        item.className = "template-subitem";
        item.textContent = group;
        item.dataset.group = group;
        item.onclick = () => loadGroup(group, item, array);
        container.appendChild(item);
    });
}

function setActive(element)
{
    document.querySelectorAll(".template-item, .template-subitem")
        .forEach(el => el.classList.remove("active"));

    element.classList.add("active");
}

function toggleSidebar()
{
    document.body.classList.toggle("sidebar-collapsed");
}

function loadProject(element)
{
    document.getElementById("title").innerText = "VHDL Project Template";

    const container = document.getElementById("templateContainer");
    container.innerHTML = "";
    container.appendChild(createBlock(null, null, templates.project, null));

    setActive(element);
}

function loadGroup(group, element, items)
{
    document.getElementById("title").innerText = group;

    const container = document.getElementById("templateContainer");
    container.innerHTML = "";

    items
        .filter(item => item.group === group)
        .forEach(item =>
            container.appendChild(
                createBlock(item.title, item.desc, item.code, item.diagram)));

    setActive(element);
}

function createFsmDiagram(d)
{
    const wire = "#1e293b";
    const accent = "#2563eb";
    const fill = "#eff6ff";
    const label = "#1e293b";
    const note = "#64748b";

    const cx = 140, cy = 74, r = 46;             // combinational-logic cloud
    const rx = 50, ry = 182, rw = 180, rh = 44;  // state register
    const sx = 111, nx = 169, linkY = 110;       // feedback / next-state links

    const moore = d.fsm === "moore";             // Moore = outputs from state only
    const rRight = rx + rw;
    const vbW = moore ? 340 : 280;

    const svg = [];

    // Combinational logic (circle)
    svg.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
    svg.push(`<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="11" fill="${label}" font-family="Arial">next-state</text>`);
    svg.push(`<text x="${cx}" y="${cy + 11}" text-anchor="middle" font-size="11" fill="${label}" font-family="Arial">${moore ? "logic" : "&amp; output"}</text>`);

    // State register (box)
    svg.push(`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="6" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
    svg.push(`<text x="${cx}" y="${ry + rh / 2 + 4}" text-anchor="middle" font-size="12" fill="${label}" font-family="Arial">state register</text>`);

    // inputs -> logic
    svg.push(`<line x1="14" y1="${cy}" x2="${cx - r}" y2="${cy}" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<polyline points="${cx - r - 8},${cy - 5} ${cx - r},${cy} ${cx - r - 8},${cy + 5}" fill="none" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<text x="14" y="${cy - 8}" text-anchor="start" font-size="12" fill="${label}" font-family="Arial">inputs</text>`);

    // Mealy: outputs come from the combinational logic (inputs + state)
    if (!moore)
    {
        svg.push(`<line x1="${cx + r}" y1="${cy}" x2="266" y2="${cy}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<polyline points="258,${cy - 5} 266,${cy} 258,${cy + 5}" fill="none" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="266" y="${cy - 8}" text-anchor="end" font-size="12" fill="${label}" font-family="Arial">outputs</text>`);
    }

    // next state: logic -> register (down)
    svg.push(`<line x1="${nx}" y1="${linkY}" x2="${nx}" y2="${ry}" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<polyline points="${nx - 5},${ry - 8} ${nx},${ry} ${nx + 5},${ry - 8}" fill="none" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<text x="${nx + 6}" y="${(linkY + ry) / 2 + 4}" text-anchor="start" font-size="11" fill="${note}" font-family="Arial">next</text>`);

    // current state: register -> logic (up, feedback)
    svg.push(`<line x1="${sx}" y1="${ry}" x2="${sx}" y2="${linkY}" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<polyline points="${sx - 5},${linkY + 8} ${sx},${linkY} ${sx + 5},${linkY + 8}" fill="none" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<text x="${sx - 6}" y="${(linkY + ry) / 2 + 4}" text-anchor="end" font-size="11" fill="${note}" font-family="Arial">state</text>`);

    // clk into register
    const clkY = ry + rh / 2;
    svg.push(`<line x1="16" y1="${clkY}" x2="${rx}" y2="${clkY}" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<polyline points="${rx},${clkY - 7} ${rx + 12},${clkY} ${rx},${clkY + 7}" fill="none" stroke="${accent}" stroke-width="2"/>`);
    svg.push(`<text x="14" y="${clkY + 4}" text-anchor="end" font-size="12" fill="${label}" font-family="Arial">clk</text>`);

    // Moore: outputs come from the state via a separate output-logic block
    if (moore)
    {
        const obx = 252, oby = 188, obw = 62, obh = 32;
        svg.push(`<line x1="${rRight}" y1="${clkY}" x2="${obx}" y2="${clkY}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<rect x="${obx}" y="${oby}" width="${obw}" height="${obh}" rx="6" fill="${fill}" stroke="${accent}" stroke-width="2"/>`);
        svg.push(`<text x="${obx + obw / 2}" y="${clkY - 3}" text-anchor="middle" font-size="10" fill="${label}" font-family="Arial">output</text>`);
        svg.push(`<text x="${obx + obw / 2}" y="${clkY + 9}" text-anchor="middle" font-size="10" fill="${label}" font-family="Arial">logic</text>`);
        svg.push(`<line x1="${obx + obw}" y1="${clkY}" x2="${vbW - 8}" y2="${clkY}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<polyline points="${vbW - 16},${clkY - 5} ${vbW - 8},${clkY} ${vbW - 16},${clkY + 5}" fill="none" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="${vbW - 8}" y="${clkY - 8}" text-anchor="end" font-size="12" fill="${label}" font-family="Arial">outputs</text>`);
    }

    const wrap = document.createElement("div");
    wrap.className = "diagram";
    wrap.innerHTML =
        `<svg viewBox="0 10 ${vbW} 230" xmlns="http://www.w3.org/2000/svg" `
        + `role="img" aria-label="${d.caption || "FSM"} schematic diagram">`
        + svg.join("")
        + `</svg>`;

    const cap = document.createElement("div");
    cap.className = "diagram-cap";
    cap.textContent = d.caption || "Finite state machine";
    wrap.appendChild(cap);

    return wrap;
}

function createCoderDiagram(d)
{
    const wire = "#1e293b";
    const accent = "#2563eb";
    const fill = "#eff6ff";
    const label = "#1e293b";

    const decoder = d.trapezoid === "decoder";
    const xL = 100, xR = 200, yc = 85, hn = 22, hw = 52;
    const hL = decoder ? hn : hw;         // left-edge half-height
    const hR = decoder ? hw : hn;         // right-edge half-height

    const inputs = d.inputs || ["in"];
    const outputs = d.outputs || [d.out || "out"];
    const buses = d.buses || [];

    const spread = (n, h) =>
    {
        if (n === 1) return [yc];
        const span = Math.min(2 * h - 16, (n - 1) * 24);
        return Array.from({ length: n }, (_, i) => yc - span / 2 + i * (span / (n - 1)));
    };

    const svg = [];

    // Trapezoid body: widens toward the outputs (decoder) or the inputs (encoder)
    svg.push(`<polygon points="${xL},${yc - hL} ${xR},${yc - hR} ${xR},${yc + hR} ${xL},${yc + hL}" `
        + `fill="${fill}" stroke="${accent}" stroke-width="2"/>`);

    // Left-side inputs
    spread(inputs.length, hL).forEach((y, i) =>
    {
        const name = inputs[i];
        svg.push(`<line x1="48" y1="${y}" x2="${xL}" y2="${y}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="42" y="${y + 4}" text-anchor="end" font-size="13" fill="${label}" font-family="Arial">${name}</text>`);
        if (buses.includes(name))
            svg.push(`<line x1="70" y1="${y - 6}" x2="78" y2="${y + 6}" stroke="${wire}" stroke-width="1.5"/>`);
    });

    // Right-side outputs
    spread(outputs.length, hR).forEach((y, i) =>
    {
        const name = outputs[i];
        svg.push(`<line x1="${xR}" y1="${y}" x2="252" y2="${y}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="258" y="${y + 4}" text-anchor="start" font-size="13" fill="${label}" font-family="Arial">${name}</text>`);
        if (buses.includes(name))
            svg.push(`<line x1="222" y1="${y - 6}" x2="230" y2="${y + 6}" stroke="${wire}" stroke-width="1.5"/>`);
    });

    const wrap = document.createElement("div");
    wrap.className = "diagram";
    wrap.innerHTML =
        `<svg viewBox="0 15 300 140" xmlns="http://www.w3.org/2000/svg" `
        + `role="img" aria-label="${d.caption || "Coder"} diagram">`
        + svg.join("")
        + `</svg>`;

    const cap = document.createElement("div");
    cap.className = "diagram-cap";
    cap.textContent = d.caption || "Decoder / encoder";
    wrap.appendChild(cap);

    return wrap;
}

function createDiagram(d)
{
    if (d.fsm) return createFsmDiagram(d);
    if (d.trapezoid) return createCoderDiagram(d);

    const wire = "#1e293b";
    const accent = "#2563eb";
    const fill = "#eff6ff";
    const label = "#1e293b";
    const note = "#64748b";

    const bus = !d.bit;
    const clk = d.clk || "rising";
    const hasClock = clk !== "none";
    const edge = clk === "rising" || clk === "falling";

    const inputs = (d.inputs || ["D"]).slice();
    if (d.enable) inputs.push("EN");

    const outputs = d.outputs || [d.out || "Q"];

    const set = d.set
        ? (typeof d.set === "string" ? { note: d.set } : d.set)
        : null;
    const reset = d.reset
        ? (typeof d.reset === "string" ? { note: d.reset } : d.reset)
        : null;

    // Layout: inputs stacked on the left, clock (if any) beneath them,
    // outputs stacked on the right; the box grows to the taller side.
    const boxX = 110, boxW = 100, boxTop = 45, step = 28;
    const firstY = boxTop + 22;
    const clockY = firstY + inputs.length * step;
    const rows = Math.max(inputs.length + (hasClock ? 1 : 0), outputs.length);
    const boxBottom = firstY + (rows - 1) * step + 22;
    const boxH = boxBottom - boxTop;
    const midX = boxX + boxW / 2;
    const rightX = boxX + boxW;

    const yTop = set ? 6 : 30;
    const yBottom = boxBottom + (reset ? 44 : 12);

    const svg = [];

    // Body
    svg.push(`<rect x="${boxX}" y="${boxTop}" width="${boxW}" height="${boxH}" rx="6" `
        + `fill="${fill}" stroke="${accent}" stroke-width="2"/>`);

    // Left-side inputs
    inputs.forEach((name, i) =>
    {
        const y = firstY + i * step;
        svg.push(`<line x1="55" y1="${y}" x2="${boxX}" y2="${y}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="49" y="${y + 4}" text-anchor="end" font-size="13" `
            + `fill="${label}" font-family="Arial">${name}</text>`);
        if ((bus && name === "D") || (d.buses && d.buses.includes(name)))
            svg.push(`<line x1="78" y1="${y - 6}" x2="86" y2="${y + 6}" stroke="${wire}" stroke-width="1.5"/>`);
    });

    // Clock, or level-sensitive gate for a latch (combinational blocks have none)
    if (hasClock)
    {
        const clkLabel = d.clkLabel || (clk === "level" ? "EN" : "CLK");
        if (clk === "falling")
        {
            svg.push(`<line x1="55" y1="${clockY}" x2="100" y2="${clockY}" stroke="${wire}" stroke-width="2"/>`);
            svg.push(`<circle cx="105" cy="${clockY}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
        }
        else
        {
            svg.push(`<line x1="55" y1="${clockY}" x2="${boxX}" y2="${clockY}" stroke="${wire}" stroke-width="2"/>`);
        }
        if (edge)
            svg.push(`<polyline points="${boxX},${clockY - 7} ${boxX + 12},${clockY} ${boxX},${clockY + 7}" `
                + `fill="none" stroke="${accent}" stroke-width="2"/>`);
        svg.push(`<text x="49" y="${clockY + 4}" text-anchor="end" font-size="13" `
            + `fill="${label}" font-family="Arial">${clkLabel}</text>`);
    }

    // Right-side outputs
    outputs.forEach((name, i) =>
    {
        const y = firstY + i * step;
        svg.push(`<line x1="${rightX}" y1="${y}" x2="265" y2="${y}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="271" y="${y + 4}" text-anchor="start" font-size="13" `
            + `fill="${label}" font-family="Arial">${name}</text>`);
        if ((bus && outputs.length === 1) || (d.buses && d.buses.includes(name)))
            svg.push(`<line x1="232" y1="${y - 6}" x2="240" y2="${y + 6}" stroke="${wire}" stroke-width="1.5"/>`);
    });

    // Set on top (optional)
    if (set)
    {
        svg.push(`<line x1="${midX}" y1="${boxTop - 25}" x2="${midX}" y2="${boxTop}" stroke="${wire}" stroke-width="2"/>`);
        if (set.low)
            svg.push(`<circle cx="${midX}" cy="${boxTop - 5}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="${midX}" y="${boxTop - 30}" text-anchor="middle" font-size="12" `
            + `fill="${label}" font-family="Arial">${set.label || "SET"}</text>`);
        if (set.note)
            svg.push(`<text x="${midX + 12}" y="${boxTop - 8}" text-anchor="start" font-size="9" `
                + `fill="${note}" font-family="Arial">${set.note}</text>`);
    }

    // Reset on bottom (optional)
    if (reset)
    {
        const stubTop = reset.low ? boxBottom + 10 : boxBottom;
        svg.push(`<line x1="${midX}" y1="${stubTop}" x2="${midX}" y2="${boxBottom + 25}" stroke="${wire}" stroke-width="2"/>`);
        if (reset.low)
            svg.push(`<circle cx="${midX}" cy="${boxBottom + 5}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="${midX}" y="${boxBottom + 38}" text-anchor="middle" font-size="12" `
            + `fill="${label}" font-family="Arial">${reset.label || "RST"}</text>`);
        if (reset.note)
            svg.push(`<text x="${midX + 12}" y="${boxBottom + 15}" text-anchor="start" font-size="9" `
                + `fill="${note}" font-family="Arial">${reset.note}</text>`);
    }

    // Widen the viewBox to the left so long input labels are not clipped
    // (labels are right-aligned at x = 49; ~8 px per character at font-size 13).
    const maxInLen = Math.max(...inputs.map(s => s.length), 1);
    const vbLeft = Math.min(0, 49 - maxInLen * 8 - 4);

    const vbWidth = Math.max(300, 271 + Math.max(...outputs.map(o => o.length), 1) * 8 + 12);

    const wrap = document.createElement("div");
    wrap.className = "diagram";
    wrap.innerHTML =
        `<svg viewBox="${vbLeft} ${yTop} ${vbWidth - vbLeft} ${yBottom - yTop}" xmlns="http://www.w3.org/2000/svg" `
        + `role="img" aria-label="${d.caption || "Schematic"} diagram">`
        + svg.join("")
        + `</svg>`;

    const cap = document.createElement("div");
    cap.className = "diagram-cap";
    cap.textContent = d.caption || (bus ? "N-bit register" : "1-bit register");
    wrap.appendChild(cap);

    return wrap;
}

function createBlock(title, desc, code, diagram)
{
    const block = document.createElement("div");
    block.className = "template-block";

    if (title)
    {
        const heading = document.createElement("h2");
        heading.textContent = title;
        block.appendChild(heading);
    }

    if (desc)
    {
        const p = document.createElement("p");
        p.className = "desc";
        p.textContent = desc;
        block.appendChild(p);
    }

    const body = document.createElement("div");
    body.className = "block-body";

    if (diagram)
    {
        body.appendChild(createDiagram(diagram));
    }

    const codeCol = document.createElement("div");
    codeCol.className = "code-col";

    const btn = document.createElement("button");
    btn.className = "copyBtn";
    btn.innerHTML = "📋 Copy";
    btn.onclick = () => copyBlock(btn);
    codeCol.appendChild(btn);

    const pre = document.createElement("pre");
    pre.textContent = code;
    codeCol.appendChild(pre);

    body.appendChild(codeCol);
    block.appendChild(body);

    return block;
}

function copyBlock(btn)
{
    const text =
        btn.parentElement.querySelector("pre").textContent;

    navigator.clipboard.writeText(text);

    const toast =
        document.getElementById("toast");

    btn.classList.add("copied");
    btn.innerHTML = "✅ Copied!";

    toast.classList.add("show");

    setTimeout(() =>
    {
        btn.classList.remove("copied");
        btn.innerHTML = "📋 Copy";

        toast.classList.remove("show");
    }, 2000);
}

// Match when every typed token is the start of a word in the text (title/group).
function matchWords(text, tokens)
{
    const words = text.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    return tokens.every(tok => words.some(w => w.startsWith(tok)));
}

function filterTemplates()
{
    const value = document.getElementById("search").value.trim().toLowerCase();
    const searching = value.length > 0;
    const tokens = value.split(/\s+/).filter(Boolean);

    document.querySelectorAll(".template-item")
        .forEach(item =>
        {
            item.style.display =
                (!searching || matchWords(item.innerText, tokens)) ? "" : "none";
        });

    document.querySelectorAll(".template-subitem")
        .forEach(sub =>
        {
            const group = sub.dataset.group;
            const match = !searching
                || matchWords(group, tokens)
                || allTemplateItems.some(item =>
                    item.group === group && matchWords(item.title, tokens));

            sub.style.display = match ? "" : "none";
        });

    // A header (including the Sequential Logic umbrella) is shown only while it still
    // holds a visible group; when the box is cleared everything collapses back.
    document.querySelectorAll(".template-group-header")
        .forEach(header =>
        {
            const container = header.nextElementSibling;
            const hasMatch = container &&
                [...container.querySelectorAll(".template-subitem")]
                    .some(s => s.style.display !== "none");

            if (searching)
            {
                header.style.display = hasMatch ? "" : "none";
                container.style.display = hasMatch ? "" : "none";
                header.classList.remove("collapsed");
                container.classList.remove("collapsed");
            }
            else
            {
                header.style.display = "";
                container.style.display = "";
                header.classList.add("collapsed");
                container.classList.add("collapsed");
            }
        });
}

loadProject(document.querySelector(".template-item"));
