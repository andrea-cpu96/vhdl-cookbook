<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VHDL Cookbook: a lightweight, offline web-based VHDL template browser for FPGA and HDL development. Search and copy ready-to-use VHDL code templates for registers, counters, finite state machines, and more with a single click.">
<meta name="keywords" content="VHDL, VHDL templates, VHDL cookbook, FPGA, HDL, VHDL code, VHDL examples, finite state machine, FSM, register, counter, shift register, sequential logic, digital design, hardware description language, VHDL snippets">

<title>VHDL Template Browser</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 280px;
    background: #1e293b;
    color: white;
    padding: 15px;
    box-sizing: border-box;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    overflow-y: auto;
}

.sidebar h2 {
    margin-top: 0;
}

.sidebar input {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    box-sizing: border-box;
    border-radius: 6px;
    border: none;
}

.template-item {
    padding: 10px;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 4px;
    transition: background 0.2s;
}

.template-item:hover {
    background: #334155;
}

.template-item.active {
    background: #2563eb;
}

.template-group-header {
    padding: 10px;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 4px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.2s;
}

.template-group-header:hover {
    background: #334155;
}

.template-group-header .caret {
    font-size: 11px;
    transition: transform 0.2s;
}

.template-group-header.collapsed .caret {
    transform: rotate(-90deg);
}

.template-subitems {
    margin: 0 0 8px 10px;
    padding-left: 8px;
    border-left: 2px solid #334155;
}

.template-subitems.collapsed {
    display: none;
}

.template-subitem {
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 3px;
    font-size: 14px;
    color: #cbd5e1;
    transition: background 0.2s;
}

.template-subitem:hover {
    background: #334155;
}

.template-subitem.active {
    background: #2563eb;
    color: white;
}

.content {
    margin-left: 280px;
    padding: 20px;
    flex-grow: 1;
}

pre {
    background: #f4f4f4;
    margin: 0;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid #ddd;
}

.template-block {
    margin-bottom: 30px;
}

.template-block h2 {
    margin-bottom: 4px;
    color: #1e293b;
}

.template-block .desc {
    margin: 0 0 10px;
    color: #64748b;
    font-size: 14px;
}

/* SCHEMATIC DIAGRAM */

.block-body {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
}

.code-col {
    position: relative;
    flex: 1 1 340px;
    min-width: 0;
}

.copyBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    margin-bottom: 0;
    padding: 6px 12px;
    font-size: 13px;
}

.diagram {
    flex: 0 0 auto;
    background: #f8fafc;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 14px;
    max-width: 320px;
}

.diagram svg {
    display: block;
    width: 100%;
    height: auto;
}

.diagram-cap {
    margin-top: 6px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
}

/* COPY BUTTON */

button {
    padding: 10px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
    margin-bottom: 15px;
}

button:hover {
    background: #1d4ed8;
}

button:active {
    transform: scale(0.96);
}

button.copied {
    background: #16a34a;
}

/* TOAST MESSAGE */

.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;

    background: #16a34a;
    color: white;

    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;

    box-shadow: 0px 4px 10px rgba(0,0,0,0.25);

    opacity: 0;
    transform: translateY(20px);

    transition: all 0.3s ease;

    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

</style>

<body>

<div class="sidebar">

    <h2>VHDL Blocks</h2>

    <input
        type="text"
        id="search"
        placeholder="Search template..."
        onkeyup="filterTemplates()">

    <div id="templates"></div>

</div>

<div class="content">

    <h1 id="title">VHDL Project Template</h1>

    <div id="templateContainer"></div>

</div>

    ✅ Template copied to clipboard
</div>

<script>

const templates = {

project: `library ieee;
use ieee.std_logic_1164.all;
use ieee.numeric_std.all;

entity my_entity is
    port (
        clk : in std_logic;
        rst : in std_logic
    );
end entity my_entity;

architecture rtl of my_entity is

begin

end architecture rtl;`,

register: [
    {
        title: "D Register",
        group: "D Registers",
        desc: "Plain D-type register: captures data on every rising clock edge, with no reset.",
        diagram: {},
        code: `process(clk)
begin
    if rising_edge(clk) then
        q <= d;
    end if;
end process;`
    },
    {
        title: "D Register — Synchronous Reset",
        group: "D Registers",
        desc: "Basic D-type register that clears to zero on a synchronous reset.",
        diagram: { reset: "sync" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "D Register — Asynchronous Reset",
        group: "D Registers",
        desc: "Clears immediately when reset asserts, independent of the clock.",
        diagram: { reset: "async" },
        code: `process(clk, rst)
begin
    if rst = '1' then
        q <= (others => '0');
    elsif rising_edge(clk) then
        q <= d;
    end if;
end process;`
    },
    {
        title: "D Register with Enable — Synchronous Reset",
        group: "D Registers",
        desc: "Loads new data only while the enable is high; reset is synchronous.",
        diagram: { enable: true, reset: "sync" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        elsif en = '1' then
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "D Register with Enable — Asynchronous Reset",
        group: "D Registers",
        desc: "Asynchronous reset combined with a clock enable for the data load.",
        diagram: { enable: true, reset: "async" },
        code: `process(clk, rst)
begin
    if rst = '1' then
        q <= (others => '0');
    elsif rising_edge(clk) then
        if en = '1' then
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "Single-Bit D Flip-Flop",
        group: "D Registers",
        desc: "Scalar one-bit register using '0' instead of (others => '0').",
        diagram: { reset: "sync", bit: true, caption: "1-bit D flip-flop" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= '0';
        else
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "D Register — Active-Low Asynchronous Reset",
        group: "D Registers",
        desc: "Industry-standard convention: reset asserts when rst_n is driven low.",
        diagram: { reset: { note: "async", low: true } },
        code: `process(clk, rst_n)
begin
    if rst_n = '0' then
        q <= (others => '0');
    elsif rising_edge(clk) then
        q <= d;
    end if;
end process;`
    },
    {
        title: "D Register with Initial Value",
        group: "D Registers",
        desc: "No reset — powers up to a value defined in the signal declaration (FPGA).",
        diagram: {},
        code: `-- In the architecture declarative part:
signal q : std_logic_vector(7 downto 0) := (others => '0');

-- In the architecture body:
process(clk)
begin
    if rising_edge(clk) then
        q <= d;
    end if;
end process;`
    },
    {
        title: "D Register — Synchronous Set",
        group: "Set / Preset",
        desc: "Presets all bits to '1' on a synchronous set instead of clearing.",
        diagram: { set: "sync" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if set = '1' then
            q <= (others => '1');
        else
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "D Register — Asynchronous Set (Preset)",
        group: "Set / Preset",
        desc: "Presets all bits to '1' immediately when set asserts, independent of the clock.",
        diagram: { set: "async" },
        code: `process(clk, set)
begin
    if set = '1' then
        q <= (others => '1');
    elsif rising_edge(clk) then
        q <= d;
    end if;
end process;`
    },
    {
        title: "D Register — Async Reset + Sync Set",
        group: "Set / Preset",
        desc: "Asynchronous reset takes priority; a synchronous set preloads all ones.",
        diagram: { set: "sync", reset: "async" },
        code: `process(clk, rst)
begin
    if rst = '1' then
        q <= (others => '0');
    elsif rising_edge(clk) then
        if set = '1' then
            q <= (others => '1');
        else
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "D Register — Falling-Edge Triggered",
        group: "D Registers",
        desc: "Samples data on the falling clock edge instead of the rising edge.",
        diagram: { reset: "sync", clk: "falling" },
        code: `process(clk)
begin
    if falling_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "Transparent Latch",
        group: "Latches",
        desc: "Level-sensitive: the output follows data while enable is high (not edge-triggered).",
        diagram: { clk: "level", clkLabel: "EN", caption: "N-bit latch" },
        code: `process(en, d)
begin
    if en = '1' then
        q <= d;
    end if;
end process;`
    },
    {
        title: "T Flip-Flop",
        group: "T / JK / SR",
        desc: "Toggles its output on each rising edge while T is high; single-bit.",
        diagram: { inputs: ["T"], reset: "sync", bit: true, caption: "T flip-flop" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= '0';
        elsif t = '1' then
            q <= not q;
        end if;
    end if;
end process;`
    },
    {
        title: "JK Flip-Flop",
        group: "T / JK / SR",
        desc: "Hold, set, reset, or toggle depending on the J and K inputs; single-bit.",
        diagram: { inputs: ["J", "K"], reset: "sync", bit: true, caption: "JK flip-flop" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= '0';
        elsif j = '1' and k = '1' then
            q <= not q;
        elsif j = '1' then
            q <= '1';
        elsif k = '1' then
            q <= '0';
        end if;
    end if;
end process;`
    },
    {
        title: "SR Flip-Flop",
        group: "T / JK / SR",
        desc: "Clocked set/reset; the S = R = '1' combination is invalid and must be avoided.",
        diagram: { inputs: ["S", "R"], reset: "sync", bit: true, caption: "SR flip-flop" },
        code: `process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= '0';
        elsif s = '1' and r = '0' then
            q <= '1';
        elsif r = '1' and s = '0' then
            q <= '0';
        end if;
    end if;
end process;`
    }
],

shift: [

    /* ── Serial I/O ─────────────────────────────── */

    {
        title: "SISO — Shift Left",
        group: "Serial I/O",
        desc: "Serial-in / serial-out delay line. Data enters the LSB and ripples toward the MSB, which appears at dout after N clock cycles.",
        diagram: { bit: true, inputs: ["DIN"], out: "DO", reset: "sync", caption: "N-stage SISO (shift left)" },
        code: `-- N-bit SISO shift register (shift left)
-- din  : serial input
-- dout : serial output (= q(N-1))
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= q(N-2 downto 0) & din;
        end if;
    end if;
end process;

dout <= q(N-1);`
    },
    {
        title: "SISO — Shift Right",
        group: "Serial I/O",
        desc: "Serial-in / serial-out register where data enters the MSB and exits the LSB (little-endian / LSB-first shift).",
        diagram: { bit: true, inputs: ["DIN"], out: "DO", reset: "sync", caption: "N-stage SISO (shift right)" },
        code: `-- N-bit SISO shift register (shift right)
-- din  : serial input
-- dout : serial output (= q(0))
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= din & q(N-1 downto 1);
        end if;
    end if;
end process;

dout <= q(0);`
    },
    {
        title: "SIPO — Serial In / Parallel Out",
        group: "Serial I/O",
        desc: "Deserializer: a stream of bits is shifted in and the full N-bit word is available in parallel after N clock cycles (UART RX pattern).",
        diagram: { inputs: ["SI"], reset: "sync", caption: "N-bit SIPO (serial → parallel)" },
        code: `-- N-bit SIPO shift register (deserializer)
-- si : serial input
-- q  : parallel output word
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= q(N-2 downto 0) & si;
        end if;
    end if;
end process;`
    },
    {
        title: "PISO — Parallel In / Serial Out",
        group: "Serial I/O",
        desc: "Serializer: the parallel word is captured when load is asserted, then shifted out one bit per cycle (LSB first by default).",
        diagram: { inputs: ["D", "LOAD", "SHIFT"], out: "SO", reset: "sync", caption: "N-bit PISO (parallel → serial)" },
        code: `-- N-bit PISO shift register (serializer)
-- d     : parallel input word
-- load  : parallel capture when high
-- shift : shift out one bit when high
-- so    : serial output
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        elsif load = '1' then
            q <= d;
        elsif shift = '1' then
            q <= '0' & q(N-1 downto 1);   -- LSB first
        end if;
    end if;
end process;

so <= q(0);`
    },

    /* ── Parallel / Universal ────────────────────── */

    {
        title: "PIPO — Parallel In / Parallel Out",
        group: "Parallel / Universal",
        desc: "Captures the whole data word when load is asserted and otherwise holds — the structural building block used by PISO and universal registers.",
        diagram: { inputs: ["D", "LOAD"], reset: "sync", caption: "N-bit PIPO (load)" },
        code: `-- N-bit PIPO register with load enable
-- (identical to an enable-gated parallel register)
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        elsif load = '1' then
            q <= d;
        end if;
    end if;
end process;`
    },
    {
        title: "Universal Bidirectional Shift Register",
        group: "Parallel / Universal",
        desc: "74194-style universal register: the 2-bit select sel chooses hold, shift right, shift left, or parallel load (codes 00 / 01 / 10 / 11).",
        diagram: { inputs: ["D", "SEL"], reset: "sync", caption: "Universal bidirectional shift register" },
        code: `-- Universal bidirectional shift register (74194-style)
-- sel  : mode select
--   "00" hold   "01" shift right   "10" shift left   "11" load
-- si_l : serial input for left shift  (enters bit 0)
-- si_r : serial input for right shift (enters bit N-1)
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            case sel is
                when "11"   => q <= d;                       -- parallel load
                when "10"   => q <= q(N-2 downto 0) & si_l;   -- shift left
                when "01"   => q <= si_r & q(N-1 downto 1);   -- shift right
                when others => null;                         -- "00" = hold
            end case;
        end if;
    end if;
end process;`
    },
    {
        title: "Shift Register with Load + Enable",
        group: "Parallel / Universal",
        desc: "Loads a seed word, then shifts on each enable — the pattern used by serializers with framing and by streaming DSP datapaths. Asynchronous reset.",
        diagram: { inputs: ["D", "SI"], enable: true, reset: "async", caption: "Shift register with load + enable" },
        code: `-- Seed load + enable-gated shift (async reset)
signal q : std_logic_vector(N-1 downto 0);

process(clk, rst)
begin
    if rst = '1' then
        q <= (others => '0');
    elsif rising_edge(clk) then
        if load = '1' then
            q <= d;                        -- seed / initial value
        elsif en = '1' then
            q <= q(N-2 downto 0) & si;     -- shift while enabled
        end if;
    end if;
end process;`
    },

/* ── Feedback ─────────────────────────────────── */

    {
        title: "Ring Counter",
        group: "Feedback",
        desc: "One-hot counter: a single '1' circulates around the ring, giving N states from N flip-flops with glitch-free decoding.",
        diagram: { inputs: [], reset: "sync", caption: "N-bit ring counter (one-hot)" },
        code: `-- Ring counter: one-hot pattern circulates forever
-- (last output feeds the first stage)
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (0 => '1', others => '0');
        else
            q <= q(0) & q(N-1 downto 1);   -- rotate right
        end if;
    end if;
end process;`
    },
    {
        title: "Johnson Counter",
        group: "Feedback",
        desc: "Twisted-ring counter: the complemented last stage feeds the input, producing 2N states where only one bit changes per step.",
        diagram: { inputs: [], reset: "sync", caption: "N-bit Johnson counter (2N states)" },
        code: `-- Johnson (twisted-ring) counter: 2N states
-- q(0) feeds back inverted into the MSB
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        else
            q <= (not q(0)) & q(N-1 downto 1);
        end if;
    end if;
end process;`
    },
    {
        title: "LFSR — Fibonacci (Maximal Length)",
        group: "Feedback",
        desc: "PRBS generator using external-XOR feedback with the maximal-length polynomial x^16 + x^14 + x^13 + x^11 + 1 (period 2^16 − 1). The all-zero state is a lock-up and must be avoided.",
        diagram: { inputs: [], reset: "sync", caption: "16-bit LFSR (Fibonacci)" },
        code: `-- 16-bit maximal-length LFSR (Fibonacci / many-to-one)
-- polynomial x^16 + x^14 + x^13 + x^11 + 1 → period 2^16 - 1
-- WARNING: the all-zero state locks up; seed must be non-zero.
signal qr : std_logic_vector(15 downto 0);
signal fb : std_logic;

fb <= qr(0) xor qr(2) xor qr(3) xor qr(5);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (0 => '1', others => '0');
        elsif load = '1' then
            qr <= seed;                      -- user seed (non-zero)
        else
            qr <= fb & qr(15 downto 1);      -- feedback into MSB
        end if;
    end if;
end process;`
    },
    {
        title: "LFSR — Galois (Internal XOR)",
        group: "Feedback",
        desc: "Same maximal-length polynomial in Galois (one-to-many) form: fewer XOR paths, faster in hardware. Requires VHDL-2008 for the array xor.",
        diagram: { inputs: [], reset: "sync", caption: "16-bit LFSR (Galois)" },
        code: `-- 16-bit maximal-length LFSR (Galois / one-to-many)
-- same polynomial x^16 + x^14 + x^13 + x^11 + 1
-- tap mask = x"B400"  (bits 15, 13, 12, 10)
signal qr : std_logic_vector(15 downto 0);

process(clk)
    variable nx : std_logic_vector(15 downto 0);
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (0 => '1', others => '0');
        else
            nx := '0' & qr(15 downto 1);     -- shift right
            if qr(0) = '1' then
                nx := nx xor x"B400";        -- VHDL-2008
            end if;
            qr <= nx;
        end if;
    end if;
end process;`
    },

    /* ── Special ──────────────────────────────────── */

    {
        title: "Variable-Length Delay Line",
        group: "Special",
        desc: "Fixed-depth shift register whose output tap is selected by a register, giving a programmable pipeline delay of 0..N−1 clocks. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["D", "SEL"], out: "DO", reset: "sync", caption: "Programmable N-tap delay" },
        code: `-- Programmable delay line:
-- dout lags din by SEL clock cycles (guard: sel < N)
signal qr : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            qr <= (others => '0');
        else
            qr <= qr(N-2 downto 0) & din;
        end if;
    end if;
end process;

dout <= qr(to_integer(unsigned(sel)));`
    },
    {
        title: "Barrel Shifter — Combinational",
        group: "Special",
        desc: "Rotates (or shifts) a word by an arbitrary amount in a single combinational path — no flip-flops. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["D", "AMT"], out: "Q", caption: "Barrel shifter (rotate right)" },
        code: `-- Combinational barrel shifter: rotate right by amt
-- (use rotate_left / srl / sll for the other directions)
q <= std_logic_vector(
        rotate_right(unsigned(d),
                     to_integer(unsigned(amt))));`
    },
    {
        title: "Arithmetic Shift Right — Combinational",
        group: "Special",
        desc: "Shifts a signed word right by an arbitrary amount while replicating the sign bit (÷2^amt for two's-complement). shift_right on unsigned gives a logical, zero-filled shift instead. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["D", "AMT"], out: "Q", caption: "Arithmetic shift right (signed)" },
        code: `-- Combinational arithmetic shift right by amt (sign-preserving)
-- shift_right on SIGNED replicates the MSB (sign bit);
-- use shift_right on UNSIGNED for a logical (zero-fill) shift.
q <= std_logic_vector(
        shift_right(signed(d),
                    to_integer(unsigned(amt))));`
    },
    {
        title: "Rotate Right — One Position per Clock",
        group: "Special",
        desc: "Cyclic rotation with a clock enable: the LSB wraps into the MSB each cycle, useful for drum-style stepping and bit-serial addressing.",
        diagram: { inputs: [], enable: true, reset: "sync", caption: "Rotate right with enable" },
        code: `-- Cyclic rotate right, one position per enabled clock
signal q : std_logic_vector(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            q <= (others => '0');
        elsif en = '1' then
            q <= q(0) & q(N-1 downto 1);     -- LSB wraps to MSB
        end if;
    end if;
end process;`
    }

],

counter: [

    /* ── Basic Counters ──────────────────────────── */

    {
        title: "Free-Running Up Counter",
        group: "Basic Counters",
        desc: "Increments by 1 every clock cycle and wraps to zero on overflow. Requires ieee.numeric_std.all.",
        diagram: { inputs: [], reset: "sync", caption: "N-bit up counter" },
        code: `-- N-bit free-running up counter (wraps on overflow)
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        else
            cnt <= cnt + 1;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },
    {
        title: "Down Counter",
        group: "Basic Counters",
        desc: "Decrements by 1 every clock cycle and wraps to all-ones on underflow. Requires ieee.numeric_std.all.",
        diagram: { inputs: [], reset: "sync", caption: "N-bit down counter" },
        code: `-- N-bit free-running down counter (wraps on underflow)
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        else
            cnt <= cnt - 1;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },
    {
        title: "Modulo-N (Wraparound) Counter",
        group: "Basic Counters",
        desc: "Counts 0 .. MOD_VAL-1 then wraps back to zero, so the modulus need not be a power of two. Requires ieee.numeric_std.all.",
        diagram: { inputs: [], reset: "sync", caption: "Modulo-N counter" },
        code: `-- Counts 0 .. MOD_VAL-1 then wraps (MOD_VAL need not be a power of 2)
-- (named MOD_VAL because MOD is a reserved VHDL operator)
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        elsif cnt = MOD_VAL - 1 then
            cnt <= (others => '0');
        else
            cnt <= cnt + 1;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },

    /* ── Up/Down ──────────────────────────────────── */

    {
        title: "Up/Down Counter",
        group: "Up/Down",
        desc: "Counts up when dir is high and down when dir is low; wraps at either end. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["DIR"], reset: "sync", caption: "Up/down counter" },
        code: `-- N-bit up/down counter
-- dir : '1' = count up, '0' = count down
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        elsif dir = '1' then
            cnt <= cnt + 1;
        else
            cnt <= cnt - 1;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },
    {
        title: "Up/Down Counter with Load + Enable",
        group: "Up/Down",
        desc: "Adds a parallel load and clock enable to the up/down counter — the pattern used by address generators and PWM duty-cycle counters. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["D", "DIR"], enable: true, reset: "sync", caption: "Up/down counter with load + enable" },
        code: `-- N-bit up/down counter with parallel load and clock enable
-- load takes priority over count; dir selects direction while en = '1'
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        elsif load = '1' then
            cnt <= unsigned(d);
        elsif en = '1' then
            if dir = '1' then
                cnt <= cnt + 1;
            else
                cnt <= cnt - 1;
            end if;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },
    {
        title: "Saturating Up/Down Counter",
        group: "Up/Down",
        desc: "Counts up or down but clamps at the limits instead of wrapping — holds at all-ones (max) and at zero (min). Requires ieee.numeric_std.all.",
        diagram: { inputs: ["DIR"], enable: true, reset: "sync", caption: "Saturating up/down counter" },
        code: `-- N-bit saturating up/down counter (clamps, never wraps)
-- dir : '1' = up, '0' = down; holds at max / min at the limits
constant CMAX : unsigned(N-1 downto 0) := (others => '1');
signal   cnt  : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        elsif en = '1' then
            if dir = '1' then
                if cnt /= CMAX then       -- hold at max
                    cnt <= cnt + 1;
                end if;
            else
                if cnt /= 0 then          -- hold at min
                    cnt <= cnt - 1;
                end if;
            end if;
        end if;
    end if;
end process;

q <= std_logic_vector(cnt);`
    },

    /* ── Timers ───────────────────────────────────── */

    {
        title: "One-Shot Countdown Timer",
        group: "Timers",
        desc: "Loads a count value on start and counts down to zero, asserting done for one clock — the pattern used for retry/timeout delays. Requires ieee.numeric_std.all.",
        diagram: { inputs: ["D", "START"], out: "DONE", reset: "sync", caption: "One-shot countdown timer" },
        code: `-- Loads d on start, counts down to zero, pulses done for 1 cycle
signal cnt  : unsigned(N-1 downto 0);
signal busy : std_logic;

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt  <= (others => '0');
            busy <= '0';
        elsif start = '1' then
            cnt  <= unsigned(d);
            busy <= '1';
        elsif busy = '1' then
            if cnt = 0 then
                busy <= '0';
            else
                cnt <= cnt - 1;
            end if;
        end if;
    end if;
end process;

done <= '1' when (busy = '1' and cnt = 0) else '0';`
    },
    {
        title: "Free-Running Tick Generator",
        group: "Timers",
        desc: "Counts up to a fixed TIMEOUT value then pulses tick for one clock and restarts — used to derive slower periodic events (e.g. a 1 ms heartbeat) from a fast system clock. Requires ieee.numeric_std.all.",
        diagram: { inputs: [], out: "TICK", reset: "sync", caption: "Free-running tick generator" },
        code: `-- Pulses tick for one clock every TIMEOUT cycles
signal cnt : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            cnt <= (others => '0');
        elsif cnt = TIMEOUT - 1 then
            cnt <= (others => '0');
        else
            cnt <= cnt + 1;
        end if;
    end if;
end process;

tick <= '1' when cnt = TIMEOUT - 1 else '0';`
    },

    /* ── Encoded ─────────────────────────────────── */

    {
        title: "Gray-Code Counter",
        group: "Encoded",
        desc: "Counts so that exactly one output bit changes per step — the safe encoding for crossing a counter value between clock domains (e.g. async-FIFO pointers). Requires ieee.numeric_std.all.",
        diagram: { inputs: [], out: "GRAY", reset: "sync", caption: "Gray-code counter" },
        code: `-- N-bit Gray-code counter: keep a binary counter, convert to Gray
-- g = b xor (b >> 1)  ->  only one bit changes between consecutive values
signal bin : unsigned(N-1 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            bin <= (others => '0');
        else
            bin <= bin + 1;
        end if;
    end if;
end process;

gray <= std_logic_vector(bin xor shift_right(bin, 1));`
    },
    {
        title: "BCD Counter — Cascaded Decades",
        group: "Encoded",
        desc: "Two-digit binary-coded-decimal counter (00..99): each 4-bit digit counts 0..9 and ripples a carry to the next — chain more digits the same way. Requires ieee.numeric_std.all.",
        diagram: { inputs: [], enable: true, out: "BCD", reset: "sync", caption: "Two-digit BCD counter (00..99)" },
        code: `-- Two-digit BCD counter: ones and tens each count 0..9
-- carry chains from ones -> tens (add more digits the same way)
signal ones, tens : unsigned(3 downto 0);

process(clk)
begin
    if rising_edge(clk) then
        if rst = '1' then
            ones <= (others => '0');
            tens <= (others => '0');
        elsif en = '1' then
            if ones = 9 then
                ones <= (others => '0');
                if tens = 9 then
                    tens <= (others => '0');
                else
                    tens <= tens + 1;
                end if;
            else
                ones <= ones + 1;
            end if;
        end if;
    end if;
end process;

-- packed 8-bit BCD output (tens : ones)
bcd <= std_logic_vector(tens) & std_logic_vector(ones);`
    }

]
};

const templateGroups = [
    { name: "Registers", array: templates.register },
    { name: "Shift Registers", array: templates.shift },
    { name: "Counters", array: templates.counter }
];

const allTemplateItems =
    templateGroups.reduce((acc, group) => acc.concat(group.array), []);

function buildSidebar()
{
    const container = document.getElementById("templates");
    container.innerHTML = "";

    const projectItem = document.createElement("div");
    projectItem.className = "template-item";
    projectItem.textContent = "VHDL Project Template";
    projectItem.onclick = () => loadProject(projectItem);
    container.appendChild(projectItem);

    templateGroups.forEach(tg =>
    {
        const header = document.createElement("div");
        header.className = "template-group-header collapsed";
        header.innerHTML =
            `<span>${tg.name}</span><span class="caret">▾</span>`;
        container.appendChild(header);

        const sub = document.createElement("div");
        sub.className = "template-subitems collapsed";
        container.appendChild(sub);

        header.onclick = () =>
        {
            header.classList.toggle("collapsed");
            sub.classList.toggle("collapsed");
        };

        const groups = [];
        tg.array.forEach(item =>
        {
            if (!groups.includes(item.group))
                groups.push(item.group);
        });

        groups.forEach(group =>
        {
            const item = document.createElement("div");
            item.className = "template-subitem";
            item.textContent = group;
            item.dataset.group = group;
            item.onclick = () => loadGroup(group, item, tg.array);
            sub.appendChild(item);
        });
    });

    return projectItem;
}

function setActive(element)
{
    document.querySelectorAll(".template-item, .template-subitem")
        .forEach(el => el.classList.remove("active"));

    element.classList.add("active");
}

function loadProject(element)
{
    document.getElementById("title").innerText = "VHDL Project Template";

    const container = document.getElementById("templateContainer");
    container.innerHTML = "";
    container.appendChild(createBlock(null, null, templates.project, null));

    setActive(element);
}

function loadGroup(group, element, items)
{
    document.getElementById("title").innerText = group;

    const container = document.getElementById("templateContainer");
    container.innerHTML = "";

    items
        .filter(item => item.group === group)
        .forEach(item =>
            container.appendChild(
                createBlock(item.title, item.desc, item.code, item.diagram)));

    setActive(element);
}

function createDiagram(d)
{
    const wire = "#1e293b";
    const accent = "#2563eb";
    const fill = "#eff6ff";
    const label = "#1e293b";
    const note = "#64748b";

    const bus = !d.bit;
    const clk = d.clk || "rising";
    const edge = clk === "rising" || clk === "falling";

    const inputs = (d.inputs || ["D"]).slice();
    if (d.enable) inputs.push("EN");

    const set = d.set
        ? (typeof d.set === "string" ? { note: d.set } : d.set)
        : null;
    const reset = d.reset
        ? (typeof d.reset === "string" ? { note: d.reset } : d.reset)
        : null;

    // Layout: data inputs stacked on the left, clock beneath them
    const boxX = 110, boxW = 100, boxTop = 45, step = 28;
    const firstY = boxTop + 22;
    const clockY = firstY + inputs.length * step;
    const boxBottom = clockY + 22;
    const boxH = boxBottom - boxTop;
    const outY = firstY;
    const midX = boxX + boxW / 2;
    const rightX = boxX + boxW;

    const yTop = set ? 6 : 30;
    const yBottom = boxBottom + (reset ? 44 : 12);

    const svg = [];

    // Body
    svg.push(`<rect x="${boxX}" y="${boxTop}" width="${boxW}" height="${boxH}" rx="6" `
        + `fill="${fill}" stroke="${accent}" stroke-width="2"/>`);

    // Left-side inputs
    inputs.forEach((name, i) =>
    {
        const y = firstY + i * step;
        svg.push(`<line x1="55" y1="${y}" x2="${boxX}" y2="${y}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="49" y="${y + 4}" text-anchor="end" font-size="13" `
            + `fill="${label}" font-family="Arial">${name}</text>`);
        if (bus && name === "D")
            svg.push(`<line x1="78" y1="${y - 6}" x2="86" y2="${y + 6}" stroke="${wire}" stroke-width="1.5"/>`);
    });

    // Clock, or level-sensitive gate for a latch
    const clkLabel = d.clkLabel || (clk === "level" ? "EN" : "CLK");
    if (clk === "falling")
    {
        svg.push(`<line x1="55" y1="${clockY}" x2="100" y2="${clockY}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<circle cx="105" cy="${clockY}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
    }
    else
    {
        svg.push(`<line x1="55" y1="${clockY}" x2="${boxX}" y2="${clockY}" stroke="${wire}" stroke-width="2"/>`);
    }
    if (edge)
        svg.push(`<polyline points="${boxX},${clockY - 7} ${boxX + 12},${clockY} ${boxX},${clockY + 7}" `
            + `fill="none" stroke="${accent}" stroke-width="2"/>`);
    svg.push(`<text x="49" y="${clockY + 4}" text-anchor="end" font-size="13" `
        + `fill="${label}" font-family="Arial">${clkLabel}</text>`);

    // Output
    svg.push(`<line x1="${rightX}" y1="${outY}" x2="265" y2="${outY}" stroke="${wire}" stroke-width="2"/>`);
    svg.push(`<text x="271" y="${outY + 4}" text-anchor="start" font-size="13" `
        + `fill="${label}" font-family="Arial">${d.out || "Q"}</text>`);
    if (bus)
        svg.push(`<line x1="232" y1="${outY - 6}" x2="240" y2="${outY + 6}" stroke="${wire}" stroke-width="1.5"/>`);

    // Set on top (optional)
    if (set)
    {
        svg.push(`<line x1="${midX}" y1="${boxTop - 25}" x2="${midX}" y2="${boxTop}" stroke="${wire}" stroke-width="2"/>`);
        if (set.low)
            svg.push(`<circle cx="${midX}" cy="${boxTop - 5}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="${midX}" y="${boxTop - 30}" text-anchor="middle" font-size="12" `
            + `fill="${label}" font-family="Arial">${set.label || "SET"}</text>`);
        if (set.note)
            svg.push(`<text x="${midX + 12}" y="${boxTop - 8}" text-anchor="start" font-size="9" `
                + `fill="${note}" font-family="Arial">${set.note}</text>`);
    }

    // Reset on bottom (optional)
    if (reset)
    {
        const stubTop = reset.low ? boxBottom + 10 : boxBottom;
        svg.push(`<line x1="${midX}" y1="${stubTop}" x2="${midX}" y2="${boxBottom + 25}" stroke="${wire}" stroke-width="2"/>`);
        if (reset.low)
            svg.push(`<circle cx="${midX}" cy="${boxBottom + 5}" r="5" fill="${fill}" stroke="${wire}" stroke-width="2"/>`);
        svg.push(`<text x="${midX}" y="${boxBottom + 38}" text-anchor="middle" font-size="12" `
            + `fill="${label}" font-family="Arial">${reset.label || "RST"}</text>`);
        if (reset.note)
            svg.push(`<text x="${midX + 12}" y="${boxBottom + 15}" text-anchor="start" font-size="9" `
                + `fill="${note}" font-family="Arial">${reset.note}</text>`);
    }

    const wrap = document.createElement("div");
    wrap.className = "diagram";
    wrap.innerHTML =
        `<svg viewBox="0 ${yTop} 300 ${yBottom - yTop}" xmlns="http://www.w3.org/2000/svg" `
        + `role="img" aria-label="Register schematic diagram">`
        + svg.join("")
        + `</svg>`;

    const cap = document.createElement("div");
    cap.className = "diagram-cap";
    cap.textContent = d.caption || (bus ? "N-bit register" : "1-bit register");
    wrap.appendChild(cap);

    return wrap;
}

function createBlock(title, desc, code, diagram)
{
    const block = document.createElement("div");
    block.className = "template-block";

    if (title)
    {
        const heading = document.createElement("h2");
        heading.textContent = title;
        block.appendChild(heading);
    }

    if (desc)
    {
        const p = document.createElement("p");
        p.className = "desc";
        p.textContent = desc;
        block.appendChild(p);
    }

    const body = document.createElement("div");
    body.className = "block-body";

    if (diagram)
    {
        body.appendChild(createDiagram(diagram));
    }

    const codeCol = document.createElement("div");
    codeCol.className = "code-col";

    const btn = document.createElement("button");
    btn.className = "copyBtn";
    btn.innerHTML = "📋 Copy";
    btn.onclick = () => copyBlock(btn);
    codeCol.appendChild(btn);

    const pre = document.createElement("pre");
    pre.textContent = code;
    codeCol.appendChild(pre);

    body.appendChild(codeCol);
    block.appendChild(body);

    return block;
}

function copyBlock(btn)
{
    const text =
        btn.parentElement.querySelector("pre").textContent;

    navigator.clipboard.writeText(text);

    const toast =
        document.getElementById("toast");

    btn.classList.add("copied");
    btn.innerHTML = "✅ Copied!";

    toast.classList.add("show");

    setTimeout(() =>
    {
        btn.classList.remove("copied");
        btn.innerHTML = "📋 Copy";

        toast.classList.remove("show");
    }, 2000);
}

function filterTemplates()
{
    const value =
        document.getElementById("search")
        .value
        .toLowerCase();

    document.querySelectorAll(".template-item")
        .forEach(item =>
        {
            item.style.display =
                item.innerText.toLowerCase().includes(value)
                    ? "block"
                    : "none";
        });

    document.querySelectorAll(".template-subitem")
        .forEach(sub =>
        {
            const group = sub.dataset.group;
            const inGroup = allTemplateItems.some(item =>
                item.group === group &&
                (item.title.toLowerCase().includes(value) ||
                 item.desc.toLowerCase().includes(value)));

            sub.style.display =
                group.toLowerCase().includes(value) || inGroup
                    ? "block"
                    : "none";
        });

    if (value)
    {
        document.querySelectorAll(".template-group-header")
            .forEach(el => el.classList.remove("collapsed"));
        document.querySelectorAll(".template-subitems")
            .forEach(el => el.classList.remove("collapsed"));
    }
}

buildSidebar();
loadProject(document.querySelector(".template-item"));

</script>
